# =============================================================================
# CONFIGURAÇÃO DO CASO BASE
# -----------------------------------------------------------------------------
# Este arquivo concentra todos os parâmetros do modelo de Unit Commitment (UC)
# day-ahead com rede, aplicado ao sistema teste RTS-GMLC modificado conforme
# Ferreira & Unsihuay-Vila (Energies 2026) / tese PPGEE-UFPR.
#
# Cada bloco corresponde a uma fase do brief de implementação
# (UC_VPL_VDC_pypsa_brief.md). Os valores aqui são os do CASO BASE; a grade de
# sensibilidades (config/scenarios.yaml) sobrescreve um eixo por vez.
# =============================================================================

paths:
  rts: data/RTS-GMLC/RTS_Data         # clone do repositório GridMod/RTS-GMLC
  results: results                     # NetCDF por cenário + CSV de métricas
  figures: figures                     # figuras em PDF vetorial (estilo IEEE)

# -----------------------------------------------------------------------------
# Dias representativos (Fase 5, §8.1 do brief). Selecionados por
# src/select_days.py a partir da caracterização de rampa da demanda líquida e
# confirmados manualmente. Cada dia = 24 snapshots horários (não se resolve o ano).
# -----------------------------------------------------------------------------
days:
  spring_wind: "2020-03-12"      # 1. eólica alta + carga baixa (maior excedente VRE da primavera)
  summer_peak: "2020-08-26"      # 2. pico anual de carga (verão)
  solar_ramp: "2020-01-14"       # 3. maior rampa de 3 h da demanda líquida (outono/inverno)
  median: "2020-03-16"           # 4. dia útil com energia de demanda líquida mediana

# -----------------------------------------------------------------------------
# Solver (Fase 5). HiGHS para desenvolvimento/validação; Gurobi para a grade
# final. O gap relativo é único para os dois solvers, por comparabilidade (§7):
# 0,5 % na depuração com HiGHS e 0,05 % na grade final com Gurobi, para que a
# complementaridade VPL+VDC (dezenas de k$/dia) fique acima do ruído do gap.
# -----------------------------------------------------------------------------
solver:
  name: gurobi                   # "highs" | "gurobi"
  threads: 8
  mip_rel_gap: 0.0005            # 0,05 %: grade final (a grade de depuração HiGHS usou 0,5 %)
  time_limit: 1800               # segundos
  log_to_console: false

# -----------------------------------------------------------------------------
# Geradores térmicos (Fase 1, §2.3)
# -----------------------------------------------------------------------------
thermal:
  marginal_cost_load_point: 0.80  # ponto (fração de PMax) onde a curva de heat-rate é linearizada
  shut_down_cost: 0.0             # $/partida; 0 conforme brief (degenerescência aceita)
  nuclear_min_up_down: 168        # h; torna a nuclear efetivamente must-run
  nuclear_p_min_pu: 0.90
  # Condição inicial do UC (não existe histórico no RTS): unidades de base
  # (min_up_time >= threshold) começam LIGADAS; as demais começam DESLIGADAS.
  # Evita que toda unidade online na hora 0 pague custo de partida.
  initial_status_min_up_threshold_h: 8

# -----------------------------------------------------------------------------
# Renováveis variáveis (VRE), hidro e armazenamento nativo do RTS (§2.4)
# -----------------------------------------------------------------------------
vre:
  carriers: ["Wind", "Solar PV", "Solar RTPV", "CSP"]
  marginal_cost: -0.1            # $/MWh: desempate interpretável do curtailment (§7)
  rtpv_must_take: false          # true => RTPV não curtailável (p_min_pu = p_max_pu), como em PCMs
  target_share: 0.50             # penetração VRE do caso base (energia disponível / carga)
  # Base do escalonamento: "annual" = fator único para o ano (parque idêntico em
  # todos os dias; penetração anual como na tese) — necessário para o critério F2;
  # "day" = fator calculado sobre os 24 snapshots do caso (leitura literal do brief).
  scaling_basis: annual
hydro:
  fixed_dispatch: true           # true => p_min_pu = p_max_pu (definição DAY_AHEAD do RTS)
rts_storage:
  include: true                  # 313_STORAGE_1 como StorageUnit (50 MW / 3 h, 85 %)

# -----------------------------------------------------------------------------
# Configuração estressada (Fase 2, §3.1) — tese / Energies 2026
# -----------------------------------------------------------------------------
stress:
  load_area: 2
  load_factor: 1.40              # +40 % de carga na Área 2
  gen_area: 3                    # geração equivalente adicionada na Área 3
  added_wind_share: 0.70         # fração eólica do acréscimo (restante em PV); ajustável se o corredor não saturar
  # O acréscimo de capacidade (MW) = (load_factor - 1) x pico anual de carga da Área 2.
  # Alocação do acréscimo: "candidates" = nós candidatos da tese (Phd_Files), no
  # anel de 230 kV que alimenta N_318; "existing" = proporcional ao VRE existente
  # (concentra em N_317 e congestiona a linha interna C29 antes do corredor).
  allocation: candidates
  candidate_sites:
    - {bus: "314", carrier: Wind,     weight_mw: 400, profile_from: 317_WIND_1}
    - {bus: "316", carrier: Wind,     weight_mw: 800, profile_from: 317_WIND_1}
    - {bus: "319", carrier: Wind,     weight_mw: 800, profile_from: 317_WIND_1}
    - {bus: "320", carrier: Solar PV, weight_mw: 300, profile_from: 320_PV_1}

corridor:
  bus_up: "318"                  # terminal a montante (Área 3)
  bus_down: "223"                # terminal a jusante (Área 2)
  branches: ["CB-1"]             # UID(s) em branch.csv; circuitos paralelos são somados
  saturation_threshold: 0.98     # |p0| >= 0,98 s_nom => hora congestionada
  # fallback documentado (§3.1): reduzir s_nom do corredor se não saturar
  limit_corridor_factor: null    # ex.: 0.8 => s_nom x 0,8; null => desligado

# -----------------------------------------------------------------------------
# Camada VPL (Fase 3, §4)
# -----------------------------------------------------------------------------
vpl:
  p_nom_mw: 200                  # por terminal; sensibilidade 100/200/400/650
  hours: 4                       # 2–4 h
  roundtrip_efficiency: 0.85     # eficiência ida-e-volta (mesmo valor da tese)
  marginal_cost: 2.0             # $/MWh na descarga (degradação)
  mode: emergent                 # "emergent" (padrão) | "explicit" (regra da tese com horas
                                 # intermediárias livres) | "dedicated" (leitura estrita da
                                 # seção 4.2.3: sem arbitragem fora dos estágios)
  sigma_high_percentile: 90      # demanda líquida >= P90 => sigma_t = 1 (alto uso)
  sigma_low_percentile: 30       # demanda líquida <= P30 => sigma_t = 0 (baixo uso)
  soc_initial: null             # null = SOC inicial livre (só ciclo fechado); 0.5 = ancorado em 50 % de e_nom
  big_m: 2000                    # MW; deve exceder o fluxo máximo possível no corredor

# -----------------------------------------------------------------------------
# Camada VDC (Fase 4, §5)
# -----------------------------------------------------------------------------
vdc:
  sites:                         # um site por área, barras de maior carga (centros de carga)
    - {name: DC_A1, bus: "118", area: 1, capacity_mw: 200, pue: 1.30}
    - {name: DC_A2, bus: "218", area: 2, capacity_mw: 200, pue: 1.30}
    - {name: DC_A3, bus: "318", area: 3, capacity_mw: 200, pue: 1.30}
  flex_fraction: 0.50            # f_d: fração flexível da capacidade elétrica
  # Energia flexível diária por site = flex_utilization x f_d x C_d x 24 (MWh elétricos).
  # flex_utilization < 1 é necessário para que exista folga temporal (com 1,0 a
  # carga flexível teria de rodar a plena capacidade 24 h e não haveria flexibilidade).
  flex_utilization: 0.70
  # Baseline dos casos sem VDC (A e B): "flat" = energia dos workloads gerados
  # distribuída uniformemente; "native" = mesmos jobs no site nativo a partir
  # da chegada (EDF), sem flexibilidade temporal nem espacial (sensibilidade).
  baseline: flat
  ramp_limit_pu: 0.50            # rampa dos Links (fração de p_nom por hora)
  workloads:
    seed: 42
    batch_share: 0.50            # fração da energia flexível em workloads batch (temporais)
    n_batch_per_site: 2
    n_migratable_per_site: 4
    batch_window_h: [8, 12]      # largura da janela batch (escalada por window_scale)
    migratable_window_h: [2, 4]
    window_scale: 1.0            # sensibilidade: x0,5 / x1 / x2 (aplicado à janela batch)
    migration_cost_range: [5, 20]  # $/MWh (IT); 0 no site nativo; assimétrico entre sites

# -----------------------------------------------------------------------------
# Reserva girante (§6)
# -----------------------------------------------------------------------------
reserve:
  enabled: true
  load_fraction: 0.03            # R_t = 0,03 x carga_t + 0,05 x VRE_disponível_t
  vre_fraction: 0.05
  from_flex: false               # true => VDC e VPL contribuem para a reserva (sensibilidade)
  common_reference: false       # true = mesmo R_t nos quatro casos (soma de volta o
                                # equivalente plano da carga flexivel do VDC em C e D)
